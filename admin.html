<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10263d"><title>نبض الحيدرية | الإدارة المستقلة</title>
<style>
:root{--navy:#10263d;--navy2:#193d58;--teal:#159e9a;--bg:#f3f6f9;--ink:#1d3042;--muted:#718294;--line:#e3eaf0;--white:#fff;--red:#c94e4e;--green:#21845f;--amber:#b77b17}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hide{display:none!important}
#login{width:min(430px,calc(100% - 28px));margin:9vh auto;background:white;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 55px #10263d18}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(140deg,#21b4ad,#117d83);display:grid;place-items:center;color:white;font-size:25px;font-weight:bold}.brand h1{font-size:20px;margin:0 0 5px}.brand small{color:var(--muted)}
#login h2{font-size:22px;margin:0 0 8px}#login p{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 20px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#536779}.field input{width:100%;padding:13px;border:1px solid #d8e1e9;border-radius:10px;outline:none}.field input:focus{border-color:var(--teal)}.btn{padding:11px 15px;border-radius:10px;background:var(--teal);color:#fff;font-weight:bold}.btn.dark{background:var(--navy)}.btn.soft{background:#e9f4f4;color:#176e70}.btn.red{background:#fff0ef;color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed}#signin{width:100%;margin-top:8px}#msg{min-height:22px;color:var(--red);font-size:12px;margin-top:10px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);color:white;padding:22px 15px}.side .brand{padding:0 6px 22px;border-bottom:1px solid #ffffff20}.side .brand small{color:#bfd0dc}.nav{display:grid;gap:7px;margin-top:22px}.nav button{padding:13px 14px;border-radius:10px;background:transparent;color:#d7e3ec;text-align:right}.nav button.active,.nav button:hover{background:#ffffff18;color:white}.sidefoot{font-size:11px;color:#a9bdcc;line-height:1.9;margin:28px 7px}
main{min-width:0}.top{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.top h2{font-size:19px;margin:0 0 5px}.top small{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.wrap{max-width:1500px;padding:25px 28px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.head h2{font-size:22px;margin:0 0 6px}.head p{font-size:13px;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel,.record{background:white;border:1px solid var(--line);border-radius:15px}.stat{padding:18px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;margin:10px 0 4px}.panel{padding:18px;margin-top:17px}.panel h3{font-size:16px;margin:0 0 15px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.inline-select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white;min-width:160px}.records{display:grid;gap:11px}.record{padding:15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.record h3{font-size:15px;margin:0 0 8px}.meta{font-size:12px;color:var(--muted);line-height:1.9;overflow-wrap:anywhere}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef3f7;color:#506476;font-size:11px}.pill.done{background:#e8f6ef;color:var(--green)}.pill.urgent{background:#fff1e4;color:var(--amber)}.photo{width:88px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;margin-top:8px}.record-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.staff-row{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.empty{text-align:center;color:var(--muted);padding:35px 12px}.loading{padding:25px;color:var(--muted);text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{padding:12px 14px}.side .brand{padding-bottom:10px;margin-bottom:8px}.nav{display:flex;overflow:auto;margin-top:8px}.nav button{white-space:nowrap;padding:10px 12px;font-size:12px}.sidefoot{display:none}.top{height:62px;padding:0 16px}.wrap{padding:17px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.head{align-items:flex-start;flex-direction:column}.record{grid-template-columns:1fr}.record-actions{justify-content:flex-start}.staff-row{grid-template-columns:1fr 1fr}.top h2{font-size:16px}.top-actions .who{display:none}.stat{padding:14px}.stat strong{font-size:24px}}
</style></head><body>
<section id="login">
 <div class="brand"><div class="logo">ن</div><div><h1>نبض الحيدرية</h1><small>بوابة الإدارة المستقلة</small></div></div>
 <h2>دخول الإدارة</h2><p>هذه الواجهة مخصصة للمدير والمشرف، ومنفصلة عن واجهة الموظفين.</p>
 <div class="field"><label>اسم المستخدم</label><input id="identity" autocomplete="username" placeholder="admin"></div>
 <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
 <button class="btn" id="signin">تسجيل الدخول</button><div id="msg"></div>
</section>
<section id="app" class="layout hide">
 <aside class="side">
  <div class="brand"><div class="logo">ن</div><div><h1>نبض الحيدرية</h1><small>الإدارة العليا</small></div></div>
  <nav class="nav" id="nav">
   <button class="active" data-tab="overview">▦　الرئيسية</button>
   <button data-tab="maintenance">🔧　بلاغات الصيانة</button>
   <button data-tab="cleaning">✦　مهام التنظيف</button>
   <button data-tab="assets">▣　الأصول والأجهزة</button>
   <button data-tab="inventory">▤　المخزون</button>
   <button data-tab="staff">♙　المستخدمون والصلاحيات</button>
  </nav><div class="sidefoot">لوحة مستقلة للإدارة والمشرفين<br>البيانات متصلة بقاعدة النظام السحابية</div>
 </aside>
 <main><header class="top"><div><h2 id="pageTitle">لوحة الإدارة</h2><small>مستشفى الحيدرية العام</small></div><div class="top-actions"><small class="who" id="who"></small><button class="btn soft" id="refresh">تحديث</button><button class="btn dark" id="logout">خروج</button></div></header>
 <div class="wrap" id="content"><div class="loading">جارٍ تحميل البيانات...</div></div></main>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://dwffkopuisuyqpgedowp.supabase.co','sb_publishable_2wT5I3b3mY1IPzbFN5NllQ_Ja136LJn');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,profile=null,records=[],profiles=[],tab='overview',signedPhotos=new Map();
const names={overview:'لوحة الإدارة',maintenance:'بلاغات الصيانة',cleaning:'مهام التنظيف',assets:'الأصول والأجهزة',inventory:'المخزون',staff:'المستخدمون والصلاحيات'};
$('signin').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('identity').addEventListener('keydown',e=>{if(e.key==='Enter')$('password').focus()});
async function login(){ $('msg').textContent='جارٍ التحقق...';$('signin').disabled=true;let id=$('identity').value.trim();let email=id.toLowerCase()==='admin'?'ama98996t@gmail.com':id;const {data,error}=await db.auth.signInWithPassword({email,password:$('password').value});$('signin').disabled=false;if(error){$('msg').textContent='تعذر تسجيل الدخول. تحقق من البيانات.';return}me=data.user;await boot()}
async function boot(){const {data:p,error}=await db.from('nabd_profiles').select('*').eq('user_id',me.id).maybeSingle();if(error||!p||!p.active||!['admin','supervisor'].includes(p.role)){$('msg').textContent='هذا الحساب لا يملك صلاحية الإدارة.';await db.auth.signOut();return}profile=p;$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=p.display_name||me.email;await refresh()}
async function refresh(){ $('content').innerHTML='<div class="loading">جارٍ تحديث البيانات...</div>';const [r,u]=await Promise.all([db.from('nabd_records').select('*').order('created_at',{ascending:false}),db.from('nabd_profiles').select('*').order('created_at',{ascending:false})]);if(r.error){$('content').innerHTML='<div class="empty">تعذر تحميل السجلات: '+esc(r.error.message)+'</div>';return}records=r.data||[];profiles=u.data||[];signedPhotos.clear();render()}
function val(r,k){const p=r.payload||{};return p[k]??r[k]??''}
function summary(r){const p=r.payload||{};return Object.entries(p).filter(([k,v])=>v&& !['photo_path','photo'].includes(k)).slice(0,5).map(([k,v])=>esc(v)).join(' · ')}
async function photoUrl(path){if(!path)return null;if(signedPhotos.has(path))return signedPhotos.get(path);const {data,error}=await db.storage.from('nabd-attachments').createSignedUrl(path,1800);const url=!error?data?.signedUrl:null;signedPhotos.set(path,url);return url}
function stats(){const active=records.filter(r=>!['مكتمل','مكتملة','done'].includes(r.status)).length;const done=records.length-active;const urgent=records.filter(r=>val(r,'priority')==='عاجل').length;return '<div class="stats"><div class="stat"><small>إجمالي السجلات</small><strong>'+records.length+'</strong><small>جميع الأقسام</small></div><div class="stat"><small>قيد المتابعة</small><strong>'+active+'</strong><small>تحتاج إجراء</small></div><div class="stat"><small>مكتملة</small><strong>'+done+'</strong><small>تم إنجازها</small></div><div class="stat"><small>بلاغات عاجلة</small><strong>'+urgent+'</strong><small>حسب الأولوية المسجلة</small></div></div>'}
function recordCard(r){const p=r.payload||{},status=r.status||p.status||p.condition||'غير محدد';const state=['مكتمل','مكتملة','يعمل','done'].includes(status)?'done':status==='عاجل'?'urgent':'';return '<article class="record"><div><h3>'+esc(p.title||p.area||p.name||r.category)+'</h3><div class="meta">'+esc(r.category)+' · '+esc(summary(r))+'<br>تاريخ التسجيل: '+new Date(r.created_at).toLocaleString('ar-IQ')+'<br>الحالة: <span class="pill '+state+'">'+esc(status)+'</span></div><div id="photo-'+esc(r.id)+'"></div></div><div class="record-actions"><select class="inline-select" data-status="'+esc(r.id)+'">'+['جديد','قيد التنفيذ','مكتمل','مكتملة','مجدولة','لم تنفذ','متوقف'].map(s=>'<option '+(s===status?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn soft" data-save="'+esc(r.id)+'">حفظ الحالة</button></div></article>'}
async function renderRecords(rows){$('content').innerHTML='<div class="head"><div><h2>'+names[tab]+'</h2><p>عرض السجلات ومتابعة حالتها والصور المرفقة</p></div></div><div class="panel"><div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو الموقع أو التفاصيل"><select id="statusFilter"><option value="">كل الحالات</option>'+[...new Set(rows.map(r=>r.status||r.payload?.status||r.payload?.condition).filter(Boolean))].map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></div><div class="records" id="records"></div></div>';$('search').oninput=filter;$('statusFilter').onchange=filter;function filter(){let q=$('search').value.toLowerCase(),s=$('statusFilter').value;let arr=rows.filter(r=>(!s||(r.status||r.payload?.status||r.payload?.condition)===s)&&JSON.stringify(r).toLowerCase().includes(q));$('records').innerHTML=arr.length?arr.map(recordCard).join(''):'<div class="empty">لا توجد سجلات مطابقة.</div>';loadPhotos(arr)}$('records').innerHTML=rows.length?rows.map(recordCard).join(''):'<div class="empty">لا توجد سجلات في هذا القسم حتى الآن.</div>';loadPhotos(rows)}
async function loadPhotos(rows){for(const r of rows){const path=r.payload?.photo_path;if(!path)continue;const url=await photoUrl(path);const el=$('photo-'+r.id);if(el&&url)el.innerHTML='<a href="'+url+'" target="_blank" rel="noopener"><img class="photo" src="'+url+'" alt="صورة مرفقة"></a>'}}
async function render(){ $('pageTitle').textContent=names[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='overview'){$('content').innerHTML='<div class="head"><div><h2>مرحباً بك في الإدارة</h2><p>ملخص مباشر لحركة العمل في المستشفى</p></div><button class="btn soft" id="export">تصدير السجلات CSV</button></div>'+stats()+'<div class="panel"><h3>أحدث السجلات</h3><div class="records">'+(records.slice(0,8).map(recordCard).join('')||'<div class="empty">لا توجد بيانات بعد.</div>')+'</div></div>';loadPhotos(records.slice(0,8));$('export').onclick=exportCSV;return}if(tab==='staff'){renderStaff();return}await renderRecords(records.filter(r=>r.category===tab))}
function renderStaff(){$('content').innerHTML='<div class="head"><div><h2>المستخدمون والصلاحيات</h2><p>إدارة حسابات الموظفين والمشرفين</p></div></div><div class="panel"><div class="staff-row" style="font-weight:bold;color:#718294"><span>المستخدم</span><span>الصلاحية</span><span>الحالة</span><span>إجراء</span></div>'+profiles.map(p=>'<div class="staff-row"><span>'+esc(p.display_name||p.user_id)+'</span><select class="inline-select" data-role="'+p.user_id+'"><option value="worker" '+(p.role==='worker'?'selected':'')+'>موظف</option><option value="supervisor" '+(p.role==='supervisor'?'selected':'')+'>مشرف</option><option value="admin" '+(p.role==='admin'?'selected':'')+'>مدير</option></select><span class="pill">'+(p.active?'نشط':'موقوف')+'</span><button class="btn soft" data-save-role="'+p.user_id+'">حفظ</button></div>').join('')+'</div>'}
async function saveStatus(id){const r=records.find(x=>x.id===id);if(!r)return;const status=document.querySelector('[data-status="'+id+'"]').value;const payload={...(r.payload||{}),status};const {error}=await db.from('nabd_records').update({status,payload,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('تعذر تحديث الحالة: '+error.message);return}await refresh()}
function exportCSV(){const rows=[['القسم','التفاصيل','الحالة','تاريخ التسجيل'],...records.map(r=>[r.category,summary(r).replace(/&amp;/g,'&'),r.status||'',r.created_at])];const csv='\ufeff'+rows.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='nabd-records.csv';a.click();URL.revokeObjectURL(a.href)}
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('content').onclick=async e=>{const save=e.target.closest('[data-save]');if(save){await saveStatus(save.dataset.save);return}const roleBtn=e.target.closest('[data-save-role]');if(roleBtn){if(profile.role!=='admin'){alert('تعديل الصلاحيات متاح للمدير فقط');return}const id=roleBtn.dataset.saveRole,role=document.querySelector('[data-role="'+id+'"]').value;const {error}=await db.from('nabd_profiles').update({role}).eq('user_id',id);if(error){alert('تعذر تحديث الصلاحية: '+error.message);return}await refresh()}};$('refresh').onclick=refresh;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
(async()=>{const {data}=await db.auth.getSession();if(data.session){me=data.session.user;await boot()}})();
</script></body></html>
