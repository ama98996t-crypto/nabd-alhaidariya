<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبض الحيدرية | الإدارة العليا</title><style>
:root{--n:#10263d;--t:#16a6a1;--bg:#f2f5f8;--line:#e3e9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#1c3042}.hide{display:none!important}header{background:var(--n);color:white;padding:20px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:21px;margin:0}header small{color:#c6d5df}.wrap{max-width:1250px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.card small{color:#758596}.card strong{display:block;font-size:28px;margin-top:12px}.panel{margin-top:18px}.panel h2{font-size:17px;margin:0 0 15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,button{border:0;border-radius:8px;padding:10px 14px;background:var(--t);color:white;cursor:pointer}.tabs button{background:#e5f2f2;color:#176f70}.tabs button.active{background:var(--n);color:white}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:#718096}select,input{padding:9px;border:1px solid #d8e0e8;border-radius:7px;background:white}#login{max-width:400px;margin:12vh auto;background:white;padding:25px;border-radius:16px}#login input{display:block;width:100%;margin:10px 0}#msg{color:#b43d36;font-size:13px;min-height:20px}.muted{color:#718096;font-size:12px}.tools{display:flex;gap:8px;align-items:center}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}header{padding:16px}.card{padding:13px}.card strong{font-size:23px}}
</style></head><body>
<section id="login"><h2>دخول الإدارة العليا</h2><p class="muted">هذه لوحة المدير والمشرفين وليست واجهة تنفيذ المهام.</p><input id="email" type="text" autocomplete="username" placeholder="اسم المستخدم (admin)"><input id="pass" type="password" placeholder="كلمة المرور"><button id="signin">تسجيل الدخول</button><div id="msg"></div></section>
<div id="app" class="hide"><header><div><h1>نبض الحيدرية | لوحة الإدارة</h1><small>إدارة ومراقبة الخدمات الداخلية</small></div><div class="tools"><span id="who"></span><button id="logout">خروج</button></div></header><main class="wrap"><div class="grid"><div class="card"><small>إجمالي البلاغات</small><strong id="total">0</strong></div><div class="card"><small>بلاغات قيد التنفيذ</small><strong id="active">0</strong></div><div class="card"><small>المهام المكتملة</small><strong id="done">0</strong></div><div class="card"><small>عدد الموظفين</small><strong id="staff">0</strong></div></div>
<nav class="tabs"><button class="active" data-tab="overview">نظرة عامة</button><button data-tab="maintenance">الصيانة</button><button data-tab="cleaning">التنظيف</button><button data-tab="assets">الأصول</button><button data-tab="inventory">المخزون</button><button data-tab="staff">إدارة المستخدمين</button></nav>
<section class="panel" id="panel"><h2>ملخص العمل</h2><p class="muted">تعرض هذه اللوحة بيانات جميع الفرق من قاعدة البيانات المشتركة.</p><div id="content"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://dwffkopuisuyqpgedowp.supabase.co','sb_publishable_2wT5I3b3mY1IPzbFN5NllQ_Ja136LJn');
let me=null,records=[],profiles=[],tab='overview';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('signin').onclick=async()=>{ $('msg').textContent='جارٍ التحقق...';const identity=$('email').value.trim();const email=identity.toLowerCase()==='admin'?'ama98996t@gmail.com':identity;const {data,error}=await db.auth.signInWithPassword({email,password:$('pass').value});if(error){$('msg').textContent='تعذر تسجيل الدخول. تأكد من اسم المستخدم وكلمة المرور.';return}me=data.user;await boot()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function boot(){const {data:p,error}=await db.from('nabd_profiles').select('*').eq('user_id',me.id).maybeSingle();if(error||!p||!p.active||p.role!=='admin'&&p.role!=='supervisor'){$('msg').textContent='هذا الحساب لا يملك صلاحية الإدارة';await db.auth.signOut();return}
$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=p.display_name||me.email;await refresh()}
async function refresh(){let [r,u]=await Promise.all([db.from('nabd_records').select('*').order('created_at',{ascending:false}),db.from('nabd_profiles').select('*').order('created_at',{ascending:false})]);if(r.error){alert(r.error.message);return}records=r.data||[];profiles=u.data||[];draw()}
async function draw(){const open=records.filter(x=>!['مكتمل','مكتملة','done'].includes(x.status));const done=records.length-open.length;$('total').textContent=records.length;$('active').textContent=open.length;$('done').textContent=done;$('staff').textContent=profiles.length;
document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let rows=records.filter(r=>tab==='overview'||r.category===tab);
if(tab==='staff'){$('content').innerHTML='<div style="overflow:auto"><table><thead><tr><th>الاسم</th><th>الصلاحية</th><th>الحالة</th><th>تحديث الصلاحية</th></tr></thead><tbody>'+profiles.map(p=>'<tr><td>'+esc(p.display_name||p.user_id)+'</td><td>'+esc(p.role)+'</td><td>'+(p.active?'نشط':'موقوف')+'</td><td><select data-role="'+p.user_id+'"><option value="worker" '+(p.role==='worker'?'selected':'')+'>موظف</option><option value="supervisor" '+(p.role==='supervisor'?'selected':'')+'>مشرف</option><option value="admin" '+(p.role==='admin'?'selected':'')+'>مدير</option></select> <button data-save-role="'+p.user_id+'">حفظ</button></td></tr>').join('')+'</tbody></table></div>';return}
$('content').innerHTML='<div style="overflow:auto"><table><thead><tr><th>القسم</th><th>التفاصيل</th><th>الحالة</th><th>الصورة</th><th>تاريخ التسجيل</th></tr></thead><tbody>'+await Promise.all(rows.map(async r=>{let photo='—';if(r.payload?.photo_path){const {data,error}=await db.storage.from('nabd-attachments').createSignedUrl(r.payload.photo_path,3600);photo=!error&&data?.signedUrl?'<a href=\"'+data.signedUrl+'\" target=\"_blank\"><img src=\"'+data.signedUrl+'\" alt=\"صورة البلاغ\" style=\"width:64px;height:48px;object-fit:cover;border-radius:7px\"></a>':'تعذر عرض الصورة'};return '<tr><td>'+esc(r.category)+'</td><td>'+esc(Object.values(r.payload||{}).filter((v,k)=>v&&k!=='photo_path').slice(0,3).join(' · '))+'</td><td>'+esc(r.status||'—')+'</td><td>'+photo+'</td><td>'+new Date(r.created_at).toLocaleDateString('ar-IQ')+'</td></tr>'})).then(x=>x).then(x=>x.join('')).join('')+'</tbody></table></div>'}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;draw()}};
$('content').onclick=async e=>{const id=e.target.dataset.saveRole;if(!id)return;const role=document.querySelector('[data-role="'+id+'"]').value;const {error}=await db.from('nabd_profiles').update({role}).eq('user_id',id);if(error){alert(error.message);return}await refresh();alert('تم تحديث الصلاحية')};
(async()=>{const {data}=await db.auth.getSession();if(data.session){me=data.session.user;await boot()}})();
</script></body></html>
