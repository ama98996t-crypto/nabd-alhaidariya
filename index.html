<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10263d"><title>نبض الحيدرية | إدارة الخدمات</title>
<style>
:root{--navy:#10263d;--navy2:#183b56;--teal:#16a6a1;--bg:#f3f6f9;--ink:#1b2b3a;--muted:#718096;--line:#e4eaf0;--white:#fff;--red:#d9534f;--amber:#d69b27;--green:#24966c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#fff;padding:24px 16px;flex-shrink:0}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 26px;border-bottom:1px solid #ffffff20}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#20b6ae,#147e8a);display:grid;place-items:center;font-size:23px;font-weight:bold}.brand h1{font-size:19px;margin:0 0 5px}.brand small{color:#b9cad8}.nav{display:grid;gap:7px;margin-top:22px}.nav button{border:0;background:transparent;color:#d4e0e9;text-align:right;padding:13px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.nav button span{display:inline-block;width:27px}.side-foot{margin-top:30px;color:#9fb3c4;font-size:11px;line-height:1.8}.main{flex:1;min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top h2{font-size:19px;margin:0}.top small{color:var(--muted)}.content{padding:26px 30px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.page-head h2{margin:0 0 6px;font-size:22px}.page-head p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--teal);color:white;font-weight:bold}.btn.secondary{background:#e9f4f4;color:#147d7b}.btn.dark{background:var(--navy2)}.btn.danger{background:#fff0ef;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin:10px 0 5px}.stat small{color:var(--muted);font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.panel h3{font-size:16px;margin:0 0 16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:normal;background:#fafcfd}td{color:#34495b}.empty{text-align:center;color:var(--muted);padding:30px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;background:#edf2f6;color:#516273}.tag.open{background:#fff5df;color:#986b12}.tag.done{background:#e7f6ef;color:#19744f}.tag.urgent{background:#fff0ef;color:#b63e39}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{max-width:220px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#526477}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:11px;border:1px solid #dbe3ea;border-radius:8px;background:white;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}.field textarea{min-height:75px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.modal{position:fixed;inset:0;background:#0c1b2a80;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialog-head h3{margin:0}.x{border:0;background:#edf2f6;border-radius:8px;width:34px;height:34px}.actions{display:flex;gap:7px}.small{padding:7px 10px;font-size:11px}.hidden{display:none!important}.notice{background:#edf7f7;border:1px solid #cce9e7;color:#246d6b;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:18px}.mobile-menu{display:none}
@media(max-width:900px){.side{width:210px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}.top{padding:0 20px}}
@media(max-width:650px){.shell{display:block}.side{width:100%;padding:12px 14px}.brand{padding:0 4px 12px;border:0}.brand h1{font-size:17px}.nav{display:flex;overflow:auto;margin-top:10px;padding-bottom:3px}.nav button{white-space:nowrap;padding:10px 12px;font-size:12px}.side-foot{display:none}.top{height:58px;padding:0 16px}.top h2{font-size:16px}.content{padding:16px}.cards{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.panel{padding:14px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><div class="logo">ن</div><div><h1>نبض الحيدرية</h1><small>إدارة الخدمات والصيانة</small></div></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span>▦</span>لوحة المؤشرات</button>
  <button data-page="maintenance"><span>🔧</span>بلاغات الصيانة</button>
  <button data-page="cleaning"><span>✦</span>مهام التنظيف</button>
  <button data-page="assets"><span>▣</span>الأصول والأجهزة</button>
  <button data-page="inventory"><span>▤</span>المخزون</button>
  <button data-page="reports"><span>▥</span>التقارير</button>
 </nav>
 <div class="side-foot">نسخة أولية تشغيلية<br>البيانات تحفظ محلياً على هذا الجهاز<br>لا تُدخل بيانات المرضى أو المعلومات الطبية</div>
</aside>
<main class="main">
 <header class="top"><div><h2 id="topTitle">لوحة المؤشرات</h2><small>مستشفى الحيدرية العام</small></div><small id="today"></small></header>
 <section class="content" id="app"></section>
</main>
</div>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h3 id="modalTitle">إضافة سجل</h3><button class="x" id="closeModal">✕</button></div><form id="recordForm"><div id="formFields"></div><div style="display:flex;gap:8px;justify-content:flex-start;margin-top:16px"><button class="btn" type="submit">حفظ السجل</button><button class="btn secondary" type="button" id="cancelModal">إلغاء</button></div></form></div></div>
<script>
const STORE='nabd_alhaidariya_v1';
const blank={maintenance:[],cleaning:[],assets:[],inventory:[]};
let data=load(),page='dashboard',editing=null;
function load(){try{return {...blank,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return structuredClone(blank)}}
function save(){localStorage.setItem(STORE,JSON.stringify(data));render()}
const titles={dashboard:'لوحة المؤشرات',maintenance:'بلاغات الصيانة',cleaning:'مهام التنظيف',assets:'الأصول والأجهزة',inventory:'المخزون',reports:'التقارير'};
document.getElementById('today').textContent=new Intl.DateTimeFormat('ar-IQ',{dateStyle:'full'}).format(new Date());
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
const configs={
maintenance:{singular:'بلاغ صيانة',fields:[['title','عنوان البلاغ','text',true],['category','نوع الصيانة','select',true,['كهرباء','ماء','تبريد','بناية','جهاز طبي','أثاث وأبواب','أخرى']],['location','الموقع / القسم','text',true],['priority','الأولوية','select',true,['عاجل','متوسط','اعتيادي']],['assigned','الفني المسؤول','text',false],['status','الحالة','select',true,['جديد','قيد التنفيذ','مكتمل','متوقف']],['notes','التفاصيل','textarea',false]]},
cleaning:{singular:'مهمة تنظيف',fields:[['area','المنطقة / القسم','text',true],['shift','الوردية','select',true,['صباحية','مسائية','ليلية']],['team','العامل / الفريق','text',true],['date','التاريخ','date',true],['start','وقت البدء','time',false],['end','وقت الانتهاء','time',false],['status','الحالة','select',true,['مجدولة','قيد التنفيذ','مكتملة','لم تنفذ']],['supervisor','المشرف','text',false],['notes','ملاحظات المشرف','textarea',false]]},
assets:{singular:'أصل / جهاز',fields:[['name','اسم الأصل أو الجهاز','text',true],['code','الرقم التعريفي الداخلي','text',false],['category','التصنيف','select',true,['جهاز طبي','كهرباء','تبريد','أثاث','ماء','أخرى']],['location','الموقع','text',true],['condition','الحالة الفنية','select',true,['يعمل','يحتاج صيانة','خارج الخدمة']],['lastService','تاريخ آخر صيانة','date',false],['notes','ملاحظات','textarea',false]]},
inventory:{singular:'مادة مخزنية',fields:[['name','اسم المادة','text',true],['category','التصنيف','select',true,['مواد تنظيف','قطع غيار','مستلزمات صيانة','أخرى']],['quantity','الكمية المتوفرة','number',true],['unit','الوحدة','text',true],['minimum','حد التنبيه','number',false],['location','موقع الخزن','text',false],['notes','ملاحظات','textarea',false]]}
};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stat(label,value,sub){return '<div class="stat"><label>'+label+'</label><strong>'+value+'</strong><small>'+sub+'</small></div>'}
function statusTag(s){let c=['مكتمل','مكتملة','يعمل'].includes(s)?'done':['عاجل','جديد','لم تنفذ','خارج الخدمة'].includes(s)?'urgent':'open';return '<span class="tag '+c+'">'+esc(s||'—')+'</span>'}
function dashboard(){let m=data.maintenance,c=data.cleaning,a=data.assets,i=data.inventory;let pending=m.filter(x=>!['مكتمل'].includes(x.status)).length;let cleanDone=c.filter(x=>x.status==='مكتملة').length;let needs=a.filter(x=>x.condition!=='يعمل').length;let low=i.filter(x=>Number(x.quantity)<=Number(x.minimum||0)).length;
return '<div class="page-head"><div><h2>نظرة عامة</h2><p>ملخص أعمال الصيانة والتنظيف والخدمات داخل المستشفى</p></div><button class="btn" onclick="openAdd(\'maintenance\')">＋ بلاغ صيانة جديد</button></div><div class="notice">تنبيه: هذه النسخة تحفظ البيانات داخل المتصفح على الجهاز الحالي فقط. لا تُدخل بيانات المرضى أو أي معلومات صحية شخصية.</div><div class="cards">'+stat('بلاغات الصيانة المفتوحة',pending,'من أصل '+m.length+' بلاغ')+stat('مهام التنظيف المكتملة',cleanDone,'من أصل '+c.length+' مهمة')+stat('أصول تحتاج متابعة',needs,'من أصل '+a.length+' أصل')+stat('مواد وصلت حد التنبيه',low,'من أصل '+i.length+' مادة')+'</div><div class="panel"><h3>آخر بلاغات الصيانة</h3>'+table('maintenance',m.slice().reverse().slice(0,5))+'</div><div class="panel"><h3>مهام التنظيف الأخيرة</h3>'+table('cleaning',c.slice().reverse().slice(0,5))+'</div>'}
function table(key,rows){let cols={maintenance:[['title','البلاغ'],['category','النوع'],['location','الموقع'],['priority','الأولوية'],['status','الحالة']],cleaning:[['area','المنطقة'],['team','الفريق'],['shift','الوردية'],['date','التاريخ'],['status','الحالة']],assets:[['name','الأصل'],['category','التصنيف'],['location','الموقع'],['condition','الحالة الفنية']],inventory:[['name','المادة'],['category','التصنيف'],['quantity','الكمية'],['unit','الوحدة'],['minimum','حد التنبيه']]};let c=cols[key];if(!rows.length)return '<div class="empty">لا توجد سجلات بعد. أضف أول سجل للبدء.</div>';return '<div class="table-wrap"><table><thead><tr>'+c.map(x=>'<th>'+x[1]+'</th>').join('')+'<th>إجراء</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+c.map(x=>'<td>'+(x[0]==='status'||x[0]==='condition'?statusTag(r[x[0]]):esc(r[x[0]]||'—'))+'</td>').join('')+'<td><div class="actions"><button class="btn secondary small" onclick="editRecord(\''+key+'\',\''+r.id+'\')">تعديل</button><button class="btn danger small" onclick="removeRecord(\''+key+'\',\''+r.id+'\')">حذف</button></div></td></tr>').join('')+'</tbody></table></div>'}
function listing(key){let cfg=configs[key],rows=data[key];return '<div class="page-head"><div><h2>'+titles[key]+'</h2><p>إدارة ومتابعة '+cfg.singular+' وتحديث حالته</p></div><button class="btn" onclick="openAdd(\''+key+'\')">＋ إضافة '+cfg.singular+'</button></div><div class="panel"><div class="filters"><input id="search" placeholder="ابحث في السجلات..." oninput="filterRows(\''+key+'\')"><select id="statusFilter" onchange="filterRows(\''+key+'\')"><option value="">كل الحالات</option>'+[...new Set(rows.map(x=>x.status||x.condition).filter(Boolean))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></div><div id="tableArea">'+table(key,rows)+'</div></div>'}
function filterRows(key){let q=(document.getElementById('search').value||'').toLowerCase(),s=document.getElementById('statusFilter').value;let rows=data[key].filter(r=>JSON.stringify(r).toLowerCase().includes(q)&&(!s||(r.status||r.condition)===s));document.getElementById('tableArea').innerHTML=table(key,rows)}
function reports(){let keys=['maintenance','cleaning','assets','inventory'];return '<div class="page-head"><div><h2>التقارير والإحصائيات</h2><p>الأرقام محسوبة مباشرة من السجلات المسجلة على هذا الجهاز</p></div><button class="btn secondary" onclick="window.print()">طباعة التقرير</button></div><div class="cards">'+keys.map(k=>stat(titles[k],data[k].length,'إجمالي السجلات')).join('')+'</div><div class="panel"><h3>ملخص الحالات</h3>'+keys.map(k=>'<p><b>'+titles[k]+'</b>: '+(data[k].length?Object.entries(data[k].reduce((o,r)=>{let s=r.status||r.condition||'غير محدد';o[s]=(o[s]||0)+1;return o},{})).map(([s,n])=>esc(s)+' ('+n+')').join('، '):'لا توجد بيانات')+'</p>').join('')+'</div>'}
function render(){document.getElementById('topTitle').textContent=titles[page];document.getElementById('app').innerHTML=page==='dashboard'?dashboard():page==='reports'?reports():listing(page)}
function openAdd(key){editing={key,id:null};buildForm(key,{})}
function editRecord(key,id){editing={key,id};let r=data[key].find(x=>x.id===id);buildForm(key,r)}
function buildForm(key,r){let cfg=configs[key];document.getElementById('modalTitle').textContent=(editing.id?'تعديل ':'إضافة ')+cfg.singular;document.getElementById('formFields').innerHTML='<div class="form-grid">'+cfg.fields.map(([name,label,type,required,opts])=>'<div class="field" style="'+(type==='textarea'?'grid-column:1/-1':'')+'"><label>'+label+(required?' *':'')+'</label>'+(type==='select'?'<select name="'+name+'" '+(required?'required':'')+'><option value="">اختر</option>'+opts.map(o=>'<option '+(r[name]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+name+'">'+esc(r[name]||'')+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+esc(r[name]||'')+'" '+(required?'required':'')+'>' )+'</div>').join('')+'</div>';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;
document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let key=editing.key,fd=new FormData(e.target),obj=Object.fromEntries(fd.entries());if(editing.id){let idx=data[key].findIndex(x=>x.id===editing.id);data[key][idx]={...data[key][idx],...obj,updatedAt:new Date().toISOString()}}else data[key].push({id:crypto.randomUUID(),...obj,createdAt:new Date().toISOString()});closeModal();save()};
function removeRecord(key,id){if(!confirm('متأكد من حذف هذا السجل؟'))return;data[key]=data[key].filter(x=>x.id!==id);save()}
render();
</script>
</body></html>
